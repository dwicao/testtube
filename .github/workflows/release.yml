name: Release APK (AOSP test key)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v3.0.1). Used for manual runs.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    # A genuinely stuck step must die on its own instead of hanging the run badge for 6h.
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve tag
        id: tag
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ inputs.tag }}" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v3.0.0" >> "$GITHUB_OUTPUT"
          fi
          cat "$GITHUB_OUTPUT"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK (manual, no deprecated action)
        run: |
          set -euo pipefail
          export ANDROID_HOME="$HOME/android-sdk"
          export ANDROID_SDK_ROOT="$HOME/android-sdk"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          cd /tmp
          curl -fsSL -o cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          rm -rf "$ANDROID_HOME/cmdline-tools/latest"
          mkdir -p "$ANDROID_HOME/cmdline-tools/latest"
          unzip -q cmdtools.zip -d /tmp/cmdtools-tmp
          mv /tmp/cmdtools-tmp/cmdline-tools/* "$ANDROID_HOME/cmdline-tools/latest/"
          rm -rf /tmp/cmdtools-tmp cmdtools.zip
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0" || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-37" || echo "android-37 not in sdkmanager yet, Gradle will download it"
          echo "SDK installed:"
          ls "$ANDROID_HOME/build-tools"

      - name: Download AOSP test key (public testkey)
        run: |
          mkdir -p "$RUNNER_TEMP/aosp-key"
          curl -fsSL -o "$RUNNER_TEMP/aosp-key/testkey.pk8" https://raw.githubusercontent.com/aosp-mirror/platform_build/master/target/product/security/testkey.pk8
          curl -fsSL -o "$RUNNER_TEMP/aosp-key/testkey.x509.pem" https://raw.githubusercontent.com/aosp-mirror/platform_build/master/target/product/security/testkey.x509.pem
          ls -l "$RUNNER_TEMP/aosp-key"
          # Convert DER pk8 -> PEM key, then bundle as PKCS12 for Gradle/apksigner.
          openssl pkcs8 -inform DER -nocrypt -in "$RUNNER_TEMP/aosp-key/testkey.pk8" -out "$RUNNER_TEMP/aosp-key/testkey.key"
          openssl pkcs12 -export \
            -in "$RUNNER_TEMP/aosp-key/testkey.x509.pem" \
            -inkey "$RUNNER_TEMP/aosp-key/testkey.key" \
            -out "$RUNNER_TEMP/aosp-key/testkey.p12" \
            -name testkey \
            -password pass:android
          echo "AOSP test key ready (public test key, password: android)"
          # Fingerprint for logs (not secret — this is the well-known AOSP test key).
          keytool -list -v -keystore "$RUNNER_TEMP/aosp-key/testkey.p12" -storetype PKCS12 -storepass android -alias testkey | grep -E "SHA256|Alias" || true

      - name: Build signed release APK
        env:
          TESTTUBE_KEYSTORE_FILE: ${{ runner.temp }}/aosp-key/testkey.p12
          TESTTUBE_KEYSTORE_PASSWORD: android
          TESTTUBE_KEY_ALIAS: testkey
          TESTTUBE_KEY_PASSWORD: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleRelease --stacktrace --console=plain
          ls -lh app/build/outputs/apk/release/ dist/ || true

      - name: Verify APK signature
        run: |
          APK=$(ls dist/testtube*.apk app/build/outputs/apk/release/*.apk 2>/dev/null | head -n 1)
          echo "APK=$APK" >> "$GITHUB_ENV"
          echo "Found: $APK"
          ls -lh "$APK"
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME/build-tools/"*/ | sort -V | tail -n 1)
          "$BUILD_TOOLS/apksigner" verify --print-certs "$APK" | head -n 20
          "$BUILD_TOOLS/apksigner" verify "$APK"

      - name: Prepare release assets + version.json
        id: assets
        run: |
          set -eu
          TAG="${{ steps.tag.outputs.tag }}"
          # Find APK without letting a missing glob abort the step (ls returns 2 if any pattern misses).
          set +o pipefail || true
          APK_SRC=$(ls dist/testtube*.apk app/build/outputs/apk/release/*.apk 2>/dev/null | head -n 1 || true)
          echo "APK_SRC=${APK_SRC:-<empty>}"
          ls -lh dist/ app/build/outputs/apk/release/ || true
          if [ -z "$APK_SRC" ]; then
            echo "No APK found"
            exit 1
          fi
          # Normalise asset name: testtube<version>.apk (e.g. testtube3.0.1.apk)
          VER="${TAG#v}"
          ASSET="testtube${VER}.apk"
          cp "$APK_SRC" "$RUNNER_TEMP/$ASSET"
          SHA=$(sha256sum "$RUNNER_TEMP/$ASSET" | awk '{print $1}')
          SIZE=$(stat -c%s "$RUNNER_TEMP/$ASSET")
          echo "asset=$RUNNER_TEMP/$ASSET" >> "$GITHUB_OUTPUT"
          echo "asset_name=$ASSET" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"
          echo "size=$SIZE" >> "$GITHUB_OUTPUT"
          echo "SHA256=$SHA SIZE=$SIZE"
          # version.json for in-app updater (UpdateManager fetches
          # https://raw.githubusercontent.com/dwicao/testtube/main/version.json first).
          NOTES=$(git log -1 --pretty=%B || echo "")
          # Escape notes for JSON via python.
          # versionCode is derived from the tag (v3.0.18 -> 30018), same formula as
          # app/build.gradle.kts, so version.json never needs a manual pre-release bump.
          # Advertising an unreleased tag with a null sha is exactly the race this avoids:
          # version.json on main must always describe an already-published release.
          python3 - "$TAG" "$ASSET" "$SHA" "$SIZE" "$NOTES" <<'PY'
          import json, re, sys
          tag, asset, sha, size, notes = sys.argv[1], sys.argv[2], sys.argv[3], int(sys.argv[4]), sys.argv[5]
          def code_from_tag(t):
              m = re.match(r'v?(\d+)\.(\d+)\.(\d+)', t.strip())
              if not m:
                  return 0
              maj, minor, patch = (int(x) for x in m.groups())
              return maj * 10000 + minor * 100 + patch
          data = {
            "tag": tag,
            "versionCode": code_from_tag(tag),
            "apkUrl": f"https://github.com/dwicao/testtube/releases/download/{tag}/{asset}",
            "sha256": sha,
            "size": size,
            "notes": notes[:2000],
            "prerelease": ("beta" in tag.lower() or "alpha" in tag.lower() or "rc" in tag.lower()),
          }
          try:
            with open("version.json") as f:
              old = json.load(f)
              if not data["versionCode"] and "versionCode" in old:
                data["versionCode"] = old["versionCode"]
              # A notice broadcast stays live across releases until cleared by hand.
              # To broadcast without an APK: edit version.json on main directly
              # (set notice/noticeTag, optionally minVersionCode) and commit.
              for key in ("notice", "noticeTag", "minVersionCode"):
                if key in old:
                  data[key] = old[key]
          except Exception:
            pass
          data.setdefault("notice", "")
          data.setdefault("noticeTag", "")
          data.setdefault("minVersionCode", 0)
          with open(f"/tmp/version-{tag}.json", "w") as f:
            json.dump(data, f, indent=2)
          print(json.dumps(data, indent=2))
          PY
          cat "/tmp/version-${TAG}.json"
          cp "/tmp/version-${TAG}.json" ./version.dist.json

      - name: Create GitHub Release + upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          draft: false
          prerelease: ${{ contains(steps.tag.outputs.tag, 'beta') || contains(steps.tag.outputs.tag, 'alpha') || contains(steps.tag.outputs.tag, 'rc') }}
          generate_release_notes: true
          files: |
            ${{ steps.assets.outputs.asset }}
            version.dist.json

      - name: Verify APK is attached before advertising it
        # version.json must never point at a release whose asset isn't downloadable yet.
        # Poll the release API until the APK shows up (or fail loudly instead of
        # publishing a version.json that 404s).
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ steps.tag.outputs.tag }}"
          ASSET="${{ steps.assets.outputs.asset_name }}"
          echo "Waiting for $ASSET on release $TAG ..."
          for i in $(seq 1 30); do
            if gh api "repos/dwicao/testtube/releases/tags/$TAG" --jq '.assets[].name' 2>/dev/null | grep -qx "$ASSET"; then
              echo "Asset present after ~$((i * 10))s"
              exit 0
            fi
            sleep 10
          done
          echo "::error::APK asset $ASSET never appeared on release $TAG"
          gh api "repos/dwicao/testtube/releases/tags/$TAG" --jq '.assets[] | .name' || true
          exit 1

      - name: Update version.json on main (for in-app updater)
        if: github.ref_type == 'tag'
        run: |
          set -euo pipefail
          TAG="${{ steps.tag.outputs.tag }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main || true
          git checkout main || git checkout -b main
          cp "/tmp/version-${TAG}.json" version.json
          cat version.json
          git add version.json
          if git diff --cached --quiet; then
            echo "version.json already up to date"
          else
            git commit -m "Update version.json for ${TAG} [skip ci]"
            git push origin HEAD:main
          fi
