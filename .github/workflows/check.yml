name: Check (debug build)

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK (manual)
        run: |
          set -euo pipefail
          export ANDROID_HOME="$HOME/android-sdk"
          export ANDROID_SDK_ROOT="$HOME/android-sdk"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          cd /tmp
          curl -fsSL -o cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          rm -rf "$ANDROID_HOME/cmdline-tools/latest"
          mkdir -p "$ANDROID_HOME/cmdline-tools/latest"
          unzip -q cmdtools.zip -d /tmp/cmdtools-tmp
          mv /tmp/cmdtools-tmp/cmdline-tools/* "$ANDROID_HOME/cmdline-tools/latest/"
          rm -rf /tmp/cmdtools-tmp cmdtools.zip
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0" || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-37" || echo "android-37 not in sdkmanager yet, Gradle will download it"

      - name: Assemble debug (compile check)
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleDebug --stacktrace --console=plain

      - name: Unit tests
        run: |
          ./gradlew --no-daemon :app:testDebugUnitTest --stacktrace --console=plain

      - name: Android lint (release)
        run: |
          ./gradlew --no-daemon :app:lintRelease --stacktrace --console=plain
